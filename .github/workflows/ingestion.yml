name: Ingestão SSPDS

on:
  schedule:
    - cron: "0 3 * * *" # Executa diariamente às 03:00 UTC
  workflow_dispatch:

# A purga de cargas incompletas pressupõe que apenas uma ingestão esteja ativa.
concurrency:
  group: sspds-ingestion
  cancel-in-progress: false

jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Confiar no certificado intermediário da SSPDS
        run: |
          sudo cp certs/amazon-rsa-2048-m01.crt /usr/local/share/ca-certificates/
          sudo update-ca-certificates

      - name: Executar ingestão
        env:
          HASH_CHUNK_SIZE: "1048576"
          TEMP_PATH: "tmp"
          INSERT_CHUNK_SIZE: "300"
          CHUNK_SIZE: "1048576"
          DOWNLOADER_TIMEOUT: "60"
          CRAWLER_TIMEOUT: "20"
          LOG_LEVEL: "INFO"
          REQUESTS_CA_BUNDLE: "/etc/ssl/certs/ca-certificates.crt"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          url_sspds: "https://www.ce.gov.br/sspds/estatisticas/"
          url_sspds_historico: "https://www.ce.gov.br/sspds/estatisticas/dados-detalhados/"
          INTERVALO_MAXIMO_ANOS: 6
        run: python -m ingestion.pipeline

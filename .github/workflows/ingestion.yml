name: Ingestão SSPDS

on:
  workflow_dispatch:

# A purga de cargas incompletas pressupõe que apenas uma ingestão esteja ativa.
concurrency:
  group: sspds-ingestion
  cancel-in-progress: false

jobs:
  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes da ingestão
        env:
          HASH_CHUNK_SIZE: "1048576"
          TEMP_PATH: "tmp"
          INSERT_CHUNK_SIZE: "500"
          CHUNK_SIZE: "1048576"
          LOG_LEVEL: "INFO"
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_KEY: "test-key"
          url_sspds: "https://www.sspds.ce.gov.br/"
          url_sspds_historico: "https://www.sspds.ce.gov.br/"
        run: python -m pytest tests/test_versionamento.py -q

      - name: Executar ingestão
        env:
          HASH_CHUNK_SIZE: ${{ secrets.HASH_CHUNK_SIZE || '1048576' }}
          TEMP_PATH: "tmp"
          INSERT_CHUNK_SIZE: ${{ secrets.INSERT_CHUNK_SIZE || '500' }}
          CHUNK_SIZE: ${{ secrets.CHUNK_SIZE || '1048576' }}
          DOWNLOADER_TIMEOUT: ${{ secrets.DOWNLOADER_TIMEOUT || '60' }}
          CRAWLER_TIMEOUT: ${{ secrets.CRAWLER_TIMEOUT || '20' }}
          LOG_LEVEL: "INFO"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          url_sspds: ${{ secrets.URL_SSPDS }}
          url_sspds_historico: ${{ secrets.URL_SSPDS_HISTORICO }}
        run: python -m ingestion.pipeline

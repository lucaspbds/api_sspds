services:
  api:
    build:
      context: .
      dockerfile: app/dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/workspace/app   
    working_dir: /workspace
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ingestion:
    build:
      context: .
      dockerfile: ingestion/dockerfile
    env_file:
      - .env
    volumes:
      - ./ingestion:/workspace/ingestion
    working_dir: /workspace
    command: python -m ingestion.pipeline
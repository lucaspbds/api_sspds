[pytest]
# Define a versão mínima do pytest exigida para rodar o projeto
minversion = 8.0

# Argumentos executados automaticamente
addopts =
    -v
    --color=yes
    --tb=short

# Pasta onde o pytest procura os testes
testpaths =
    tests

# Padrão dos nomes dos arquivos de teste
python_files = test_*.py

# Marcadores customizados
markers =
    database: marca testes que interagem com o banco de dados do Supabase
    integration: marca testes de integração entre serviços